syntax = "proto3";

package post;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.example.simplegrpcpost2604.grpc";

service PostService {
  rpc PublishPost (PostPublishRequest) returns (PostPublishResponse);
  rpc ReadPostOne (PostReadOneRequest) returns (PostReadOneResponse);
  rpc ReadPostList (google.protobuf.Empty) returns (PostReadListResponse);
  rpc EditPost (PostEditRequest) returns (PostEditResponse);
  rpc DeletePost (PostDeleteRequest) returns (PostDeleteResponse);
}

message PostPublishRequest {
    int64 userId = 1;

    string title = 2;
    string content = 3;
}
message PostPublishResponse {
    int64 userId = 1;

    int64 id = 2;
    string title = 3;
    string content = 4;
}

message PostReadOneRequest {
    int64 userId = 1;

    int64 id = 2;
}
message PostReadOneResponse {
    int64 userId = 1;

    int64 id = 2;
    string title = 3;
    string content = 4;
}

message PostReadListResponse {
    repeated PostReadOneResponse postReadOneResponseList = 1;
}

message PostEditRequest {
    int64 userId = 1;

    int64 id = 2;
    string title = 3;
    string content = 4;
}
message PostEditResponse {
    int64 userId = 1;

    int64 id = 2;
    string title = 3;
    string content = 4;
}

message PostDeleteRequest {
    int64 userId = 1;

    int64 id = 2;
}
message PostDeleteResponse {
    int64 id = 1;
}