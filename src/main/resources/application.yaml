spring:
  application:
    name: simple-grpc-post-2604

  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9090}

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/grpc_demo
    username: ${POSTGRES_USER:root}
    password: ${POSTGRES_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true